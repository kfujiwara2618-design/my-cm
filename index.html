<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>動画再生</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #000;
    }

    body {
      display: grid;
      place-items: center;
    }

    video {
      display: block;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      object-fit: contain;
      background: #000;
    }
  </style>
</head>

<body>
  <video
    controls
    playsinline
    preload="metadata"
    loop>
    <source src="./video.mp4" type="video/mp4">
    お使いのブラウザは動画再生に対応していません。
  </video>
</body>
</html>
